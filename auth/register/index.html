<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
    <link rel="stylesheet" href="/src/css/register.css" />
  </head>

  <body>
    <div class="flex flex-col min-h-screen">
      <main class="flex-1">
        <div class="text-left p-10">
          <img
            class="cursor-pointer"
            src="/asset/snappo.png"
            alt="Snappo logo"
          />

          <h1 class="text-[#a9a8a8] m-0 text-left">Connect. Share. Inspire</h1>
        </div>
        <form
          class="flex flex-col text-lg mx-auto max-w-[40rem] pt-4"
          name="register"
        >
          <div class="w-full flex flex-col gap-4 text-left">
            <label class="text-purple-600" for="name">Name</label>
            <input
              id="name"
              type="text"
              name="name"
              required
              maxlength="20"
              pattern="^[\w]+$"
              title="Please enter a username using only letters and numbers"
              placeholder="Max 20 characters"
              class="mb-4 p-2 text-base border-2 border-transparent rounded-md"
              style="
                background-image: linear-gradient(white, white),
                  linear-gradient(135deg, #e0b230, #07d8ba);
                background-origin: border-box;
                background-clip: padding-box, border-box;
              "
            />

            <label class="text-purple-600" for="email">Email</label>
            <input
              id="email"
              type="email"
              name="email"
              required
              pattern="^[\w\-.]+@(stud\.)?noroff\.no$"
              title="Please enter a valid noroff.no or stud.noroff.no address"
              placeholder="Email with @(stud.)noroff.no"
              class="mb-4 p-2 text-base border-2 border-transparent rounded-md"
              style="
                background-image: linear-gradient(white, white),
                  linear-gradient(135deg, #e0b230, #07d8ba);
                background-origin: border-box;
                background-clip: padding-box, border-box;
              "
            />

            <label class="text-purple-600" for="password">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              required
              minlength="8"
              placeholder="Min 08 characters"
              class="mb-4 p-2 text-base border-2 border-transparent rounded-md"
              style="
                background-image: linear-gradient(white, white),
                  linear-gradient(135deg, #e0b230, #07d8ba);
                background-origin: border-box;
                background-clip: padding-box, border-box;
              "
            />
          </div>
          <div id="errors" class="error text-red-500"></div>
          <div class="text-center p-8">
            <button
              id="register-submit-button"
              type="submit"
              class="register-button bg-gradient-to-r from-purple-700 to-teal-500 text-white py-4 w-40 rounded-md font-bold cursor-pointer transition duration-300" style="background: linear-gradient(135deg, #9747ff, #07d8ba);"
            >
              REGISTER
            </button>
          </div>
          <hr class="my-4 border-t border-gray-300 opacity-25" />
        </form>

        <div class="text-center font-bold" style="color: #a9a8a8;">Already registered?</div>
        <div class="text-center p-4">
          <a href="/auth/login/" class="font-bold text-base underline" style="background: linear-gradient(135deg, #9747ff, #07d8ba); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration-color: #8c5fff; text-decoration-thickness: 3px;">LOGIN</a>
        </div>
      </main>
    </div>
    <footer
      class="mt-12 w-full text-center py-5 text-white"
      style="background: linear-gradient(135deg, #9747ff, #07d8ba)"
    >
      <p class="flex justify-center items-center text-base">
        &copy; 2024 Snappo. All rights reserved.
      </p>
    </footer>
  </body>
</html>

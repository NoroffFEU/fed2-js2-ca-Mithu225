<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
    <link rel="stylesheet" href="/src/css/login.css" />
  </head>

  <body>
    <div class="flex flex-col min-h-screen">
      <main class="flex-1">
        <div class="text-left p-10">
          <img
            class="cursor-pointer"
            src="/asset/snappo.png"
            alt="Snappo logo"
          />

          <h1 class="text-[#a9a8a8] m-0 text-left">Connect. Share. Inspire</h1>
        </div>
        <form
          class="flex flex-col text-lg mx-auto max-w-[40rem] pt-4"
          name="login"
        >
          <div class="login-form">
            <label class="text-purple-600" for="email">Email</label>
            <input
              class="mb-4 p-2 text-base border-2 border-transparent rounded-md"
              style="
                background-image: linear-gradient(white, white),
                  linear-gradient(135deg, #e0b230, #07d8ba);
                background-origin: border-box;
                background-clip: padding-box, border-box;
              "
              id="email"
              type="email"
              name="email"
              required
            />

            <label class="text-purple-600" for="password">Password</label>
            <input
              class="mb-4 p-2 text-base border-2 border-transparent rounded-md"
              style="
                background-image: linear-gradient(white, white),
                  linear-gradient(135deg, #e0b230, #07d8ba);
                background-origin: border-box;
                background-clip: padding-box, border-box;
              "
              type="password"
              name="password"
              id="password"
              required
            />
          </div>
          <div id="errors" class="error text-red-500"></div>
          <div class="login-click">
            <button id="login-submit-button" type="submit" class="login-button">
              LOGIN
            </button>
          </div>
          <a href="/auth/register/" class="switch-register">REGISTER</a>
        </form>
      </main>
    </div>

    <footer
      class="mt-12 w-full text-center py-5 text-white"
      style="background: linear-gradient(135deg, #9747ff, #07d8ba)"
    >
      <p>&copy; 2024 Snappo. All rights reserved.</p>
    </footer>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests"
    />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
    <link rel="stylesheet" href="/src/css/home.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/profile.css" />
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </head>

  <body>
    <div class="flex flex-col min-h-screen">
      <main class="content">
        <header class="flex justify-between items-center bg-white p-2.5 px-5">
          <div class="header-left">
            <a href="/">
              <img
                class="cursor-pointer"
                src="/asset/snappo.png"
                alt="Snappo logo"
            /></a>
          </div>
          <div class="flex flex-grow justify-center items-center">
            <input
              type="text"
              placeholder="Search...."
              class="w-1/2 p-2 text-lg border border-gray-300 rounded-full outline-none"
            />
            <button class="cursor-pointer border-0 ml-[-40px] bg-white">
              <ion-icon
                class="text-lg text-[#a9a8a8]"
                name="search-outline"
              ></ion-icon>
            </button>
          </div>
          <div class="flex gap-4">
            <div class="flex items-center gap-2">
              <button
                id="list"
                class="w-10 h-10 bg-gradient-to-r from-[#a060f0] to-[#5cc9f5] p-1 rounded transition-transform duration-300 border-none"
              >
                <ion-icon
                  class="text-white cursor-pointer"
                  size="large"
                  name="newspaper-outline"
                ></ion-icon>
              </button>
              <button
                id="profile"
                class="w-10 h-10 bg-gradient-to-r from-[#a060f0] to-[#5cc9f5] p-1 rounded transition-transform duration-300 border-none"
              >
                <ion-icon
                  class="text-white cursor-pointer"
                  size="large"
                  name="person-circle-outline"
                ></ion-icon>
              </button>
              <button
                id="logout-button"
                class="w-10 h-10 bg-gradient-to-r from-[#a060f0] to-[#5cc9f5] p-1 rounded transition-transform duration-300 border-none"
              >
                <ion-icon
                  class="text-white cursor-pointer"
                  size="large"
                  name="log-out-outline"
                ></ion-icon>
              </button>
            </div>
          </div>
        </header>
        <div class="body-top">
          <div class="flex gap-4 w-20 h-16" id="avatar-home"></div>

          <div class="dropdown">
            <button class="dropdown-button" id="selected-post">All post</button>
            <ion-icon
              class="p-1"
              name="caret-down-outline"
            ></ion-icon>
            <div class="dropdown-content">
              <button id="selected-all-post">All post</button>
              <button id="selected-my-post">My post</button>
            </div>
          </div>
        </div>
        <div id="message-box" style="display: none; color: green"></div>
        <div class="body-container">
          <input
            type="text"
            placeholder="What are you thinking about?"
            class="status-input"
            id="statusInput"
          />
        </div>

        <div class="flex flex-col items-center justify-center h-full py-8" id="post-container">loading.....</div>
      </main>
    </div>
    <footer class="footer">
      <p>&copy; 2024 Snappo. All rights reserved.</p>
    </footer>
  </body>
</html>

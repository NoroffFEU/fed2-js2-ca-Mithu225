<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests"
    />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
    <link rel="stylesheet" href="/src/css/home.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/profile.css" />
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </head>
  <body>
    <div class="flex flex-col min-h-screen">
      <main class="flex-1">
        <header
          class="flex flex-wrap justify-between items-center bg-white p-2.5 px-5"
        >
          <div class="header-left">
            <a href="/">
              <img
                class="cursor-pointer"
                src="/asset/snappo.png"
                alt="Snappo logo"
              />
            </a>
          </div>

          <div
            class="flex flex-grow justify-start items-center mt-2 sm:mt-0 pl-7 md:pl-4"
          >
            <input
              type="text"
              placeholder="Search...."
              class="w-3/4 sm:w-1/2 p-2 text-lg border border-gray-300 rounded-full outline-none"
            />
            <button class="cursor-pointer border-0 ml-[-40px] bg-white">
              <ion-icon
                class="text-lg text-[var(--color-title)]"
                name="search-outline"
              ></ion-icon>
            </button>
          </div>

          <div class="flex gap-4 mt-3 sm:mt-0 justify-start sm:justify-end">
            <div class="flex items-center gap-2">
              <button
                id="list"
                class="w-10 h-10 bg-gradient-to-tr from-[var(--color-gradient-from)] to-[var(--color-gradient-to)] p-1 border-0 rounded-md text-lg font-bold cursor-pointer transition-[background] duration-300 ease-in-out hover:bg-gradient-to-tr hover:from-[var(--color-gradient-hover-from)] hover:to-[var(--color-gradient-hover-to)]"
              >
                <ion-icon
                  class="text-white cursor-pointer"
                  size="large"
                  name="newspaper-outline"
                ></ion-icon>
              </button>
              <button
                id="profile"
                class="w-10 h-10 bg-gradient-to-tr from-[var(--color-gradient-from)] to-[var(--color-gradient-to)] p-1 border-0 rounded-md text-lg font-bold cursor-pointer transition-[background] duration-300 ease-in-out hover:bg-gradient-to-tr hover:from-[var(--color-gradient-hover-from)] hover:to-[var(--color-gradient-hover-to)]"
              >
                <ion-icon
                  class="text-white cursor-pointer"
                  size="large"
                  name="person-circle-outline"
                ></ion-icon>
              </button>
              <button
                id="logout-button"
                class="w-10 h-10 bg-gradient-to-tr from-[var(--color-gradient-from)] to-[var(--color-gradient-to)] p-1 border-0 rounded-md text-lg font-bold cursor-pointer transition-[background] duration-300 ease-in-out hover:bg-gradient-to-tr hover:from-[var(--color-gradient-hover-from)] hover:to-[var(--color-gradient-hover-to)]"
              >
                <ion-icon
                  class="text-white cursor-pointer"
                  size="large"
                  name="log-out-outline"
                ></ion-icon>
              </button>
            </div>
          </div>
        </header>

        <div class="flex flex-wrap items-center justify-between p-8">
          <div class="flex gap-4 w-20 h-16" id="avatar-home"></div>

          <div
            class="ml-auto relative inline-block border-2 border-purple-200 rounded-md cursor-pointer text-right group"
          >
            <button
              class="bg-white text-black border-0 text-base py-4 px-6 focus:outline-none"
              id="selected-post"
            >
              All post
            </button>
            <ion-icon class="p-1" name="caret-down-outline"></ion-icon>
            <div
              class="absolute right-0 text-left border-purple-200 min-w-[160px] rounded-md shadow-lg z-10 hidden group-hover:block"
            >
              <button
                id="selected-all-post"
                class="text-purple-600 py-3 px-4 w-full border-0 bg-transparent cursor-pointer hover:bg-purple-200"
              >
                All post
              </button>
              <button
                id="selected-my-post"
                class="text-purple-600 py-3 px-4 w-full border-0 bg-transparent cursor-pointer hover:bg-purple-200"
              >
                My post
              </button>
            </div>
          </div>
        </div>
        <div
          id="message-box"
          class="hidden text-center pb-4 text-green-500"
        ></div>
        <div class="text-center">
          <input
            type="text"
            placeholder="What are you thinking about?"
            class="w-2/3 sm:w-1/3 py-2 px-6 text-base border border-gray-300 rounded-lg outline-none"
            id="statusInput"
          />
        </div>

        <div
          class="flex flex-col items-center justify-center h-full py-8"
          id="post-container"
        >
          loading.....
        </div>
      </main>
    </div>
    <footer
      class="mt-12 w-full text-center py-5 text-white bg-gradient-to-tr from-[var(--color-gradient-from)] to-[var(--color-gradient-to)]"
    >
      <p class="flex justify-center items-center text-base">
        &copy; 2024 Snappo. All rights reserved.
      </p>
    </footer>
  </body>
</html>

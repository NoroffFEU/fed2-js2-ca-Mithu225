<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests"
    />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
    <link rel="stylesheet" href="/src/css/home.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/profile.css" />
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </head>

  <body>
    <div class="flex flex-col min-h-screen">
      <main class="flex-1">
        <header class="flex justify-between items-center bg-white p-2.5 px-5">
          <div class="header-left">
            <a href="/">
              <img
                class="cursor-pointer"
                src="/asset/snappo.png"
                alt="Snappo logo"
            /></a>
          </div>
          <div class="flex flex-grow justify-center items-center">
            <input
              type="text"
              placeholder="Search...."
              class="w-1/2 p-2 text-lg border border-gray-300 rounded-full outline-none"
            />
            <button class="cursor-pointer border-0 ml-[-40px] bg-white">
              <ion-icon
                class="text-lg text-[#a9a8a8]"
                name="search-outline"
              ></ion-icon>
            </button>
          </div>
          <div class="flex gap-4">
            <div class="flex items-center gap-2">
              <button
                id="list"
                class="w-10 h-10 bg-gradient-to-r from-[#a060f0] to-[#5cc9f5] p-1 rounded transition-transform duration-300 border-none"
              >
                <ion-icon
                  class="text-white cursor-pointer"
                  size="large"
                  name="newspaper-outline"
                ></ion-icon>
              </button>
              <button
                id="profile"
                class="w-10 h-10 bg-gradient-to-r from-[#a060f0] to-[#5cc9f5] p-1 rounded transition-transform duration-300 border-none"
              >
                <ion-icon
                  class="text-white cursor-pointer"
                  size="large"
                  name="person-circle-outline"
                ></ion-icon>
              </button>
              <button
                id="logout-button"
                class="w-10 h-10 bg-gradient-to-r from-[#a060f0] to-[#5cc9f5] p-1 rounded transition-transform duration-300 border-none"
              >
                <ion-icon
                  class="text-white cursor-pointer"
                  size="large"
                  name="log-out-outline"
                ></ion-icon>
              </button>
            </div>
          </div>
        </header>
        <div class="flex items-center justify-between p-8">
          <div class="flex gap-4 w-20 h-16" id="avatar-home"></div>

          <div
            class="ml-auto relative inline-block border-2 border-[#b890f4] rounded-md cursor-pointer text-right group"
          >
            <button
              class="bg-white text-black border-0 text-base py-4 px-6 focus:outline-none"
              id="selected-post"
            >
              All post
            </button>
            <ion-icon class="p-1" name="caret-down-outline"></ion-icon>
            <div
              class="absolute right-0 text-left bg-[#b890f4] min-w-[160px] rounded-md shadow-lg z-10 hidden group-hover:block"
            >
              <button
                id="selected-all-post"
                class="text-[#875acb] py-3 px-4 w-full border-0 bg-transparent cursor-pointer hover:bg-[#875acb] hover:text-white"
              >
                All post
              </button>
              <button
                id="selected-my-post"
                class="text-[#875acb] py-3 px-4 w-full border-0 bg-transparent cursor-pointer hover:bg-[#875acb] hover:text-white"
              >
                My post
              </button>
            </div>
          </div>
        </div>
        <div
          id="message-box"
          class="hidden text-center pb-4 text-green-500"
        ></div>
        <div class="text-center">
          <input
            type="text"
            placeholder="What are you thinking about?"
            class="w-1/3 py-2 px-6 text-base border border-gray-300 rounded-lg outline-none"
            id="statusInput"
          />
        </div>

        <div
          class="flex flex-col items-center justify-center h-full py-8"
          id="post-container"
        >
          loading.....
        </div>
      </main>
    </div>
    <footer
      class="mt-12 w-full text-center py-5 text-white"
      style="background: linear-gradient(135deg, #9747ff, #07d8ba)"
    >
      <p class="flex justify-center items-center text-base">
        &copy; 2024 Snappo. All rights reserved.
      </p>
    </footer>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
    <link rel="stylesheet" href="/src/css/edit.css" />
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </head>
  <body>
       <header class="flex flex-col sm:flex-row justify-between items-center bg-white p-2.5 px-5 gap-4">
  
  <div class="w-full sm:w-auto flex justify-center sm:justify-start">
    <a href="/">
      <img
        class="cursor-pointer"
        src="/asset/snappo.png"
        alt="Snappo logo"
      />
    </a>
  </div>

 
  <div class="w-full sm:flex-grow flex justify-center sm:justify-start items-center sm:pl-4">
    <div class="relative w-full sm:w-1/2">
      <input
        type="text"
        placeholder="Search...."
        class="w-full p-2 text-lg border border-gray-300 rounded-full outline-none"
      />
      <button class="absolute right-3 top-1/2 transform -translate-y-1/2 cursor-pointer border-0 bg-white">
        <ion-icon
          class="text-lg text-[var(--color-title)]"
          name="search-outline"
        ></ion-icon>
      </button>
    </div>
  </div>

  <div class="w-full sm:w-auto flex justify-center sm:justify-end">
    <div class="flex items-center gap-2">
      <button
        id="list"
        class="w-10 h-10 bg-gradient-to-tr from-[var(--color-gradient-from)] to-[var(--color-gradient-to)] p-1 border-0 rounded-md text-lg font-bold cursor-pointer transition-[background] duration-300 ease-in-out hover:bg-gradient-to-tr hover:from-[var(--color-gradient-hover-from)] hover:to-[var(--color-gradient-hover-to)]"
      >
        <ion-icon
          class="text-white cursor-pointer"
          size="large"
          name="newspaper-outline"
        ></ion-icon>
      </button>
      <button
        id="profile"
        class="w-10 h-10 bg-gradient-to-tr from-[var(--color-gradient-from)] to-[var(--color-gradient-to)] p-1 border-0 rounded-md text-lg font-bold cursor-pointer transition-[background] duration-300 ease-in-out hover:bg-gradient-to-tr hover:from-[var(--color-gradient-hover-from)] hover:to-[var(--color-gradient-hover-to)]"
      >
        <ion-icon
          class="text-white cursor-pointer"
          size="large"
          name="person-circle-outline"
        ></ion-icon>
      </button>
      <button
        id="logout-button"
        class="w-10 h-10 bg-gradient-to-tr from-[var(--color-gradient-from)] to-[var(--color-gradient-to)] p-1 border-0 rounded-md text-lg font-bold cursor-pointer transition-[background] duration-300 ease-in-out hover:bg-gradient-to-tr hover:from-[var(--color-gradient-hover-from)] hover:to-[var(--color-gradient-hover-to)]"
      >
        <ion-icon
          class="text-white cursor-pointer"
          size="large"
          name="log-out-outline"
        ></ion-icon>
      </button>
    </div>
  </div>
</header>

    <div class="container-text-center text-[var(--color-title)] text-2xl">
      <h1 class="text-center text-[var(--color-title)] pt-4 text-3xl">
        Edit Post
      </h1>
    </div>

    <form
      class="flex flex-col text-lg mx-auto max-w-[40rem] py-4 px-8 sm:px-0"
      name="updatePost"
    >
      <div class="flex flex-col gap-4">
        <label class="text-purple-600" for="post-title">Title:</label>
        <input
          class="mb-4 p-2 text-base border-2 border-transparent rounded-md bg-origin-border [background-image:linear-gradient(white,white),linear-gradient(135deg,var(--color-gradient-from),var(--color-gradient-to))] [background-clip:padding-box,border-box]"
          type="text"
          id="post-title"
          name="title"
          required
        />

        <label class="text-purple-600" for="post-content">Content:</label>
        <textarea
          class="mb-4 p-2 text-base border-2 border-transparent rounded-md bg-origin-border [background-image:linear-gradient(white,white),linear-gradient(135deg,var(--color-gradient-from),var(--color-gradient-to))] [background-clip:padding-box,border-box]"
          aria-label="message"
          rows="10"
          cols="45"
          name="body"
          id="message"
        ></textarea>

        <label class="text-purple-600" for="key-words">Tags:</label>
        <input
          class="mb-4 p-2 text-base border-2 border-transparent rounded-md bg-origin-border [background-image:linear-gradient(white,white),linear-gradient(135deg,var(--color-gradient-from),var(--color-gradient-to))] [background-clip:padding-box,border-box]"
          type="strings"
          id="keywords"
          name="tags"
        />

        <label class="text-purple-600" for="post-image">Image URL:</label>
        <input
          class="mb-4 p-2 text-base border-2 border-transparent rounded-md bg-origin-border [background-image:linear-gradient(white,white),linear-gradient(135deg,var(--color-gradient-from),var(--color-gradient-to))] [background-clip:padding-box,border-box]"
          type="url"
          id="post-image"
          name="image-url"
        />

        <label class="text-purple-600" for="image-alt">Image Alt:</label>
        <input
          class="mb-4 p-2 text-base border-2 border-transparent rounded-md bg-origin-border [background-image:linear-gradient(white,white),linear-gradient(135deg,var(--color-gradient-from),var(--color-gradient-to))] [background-clip:padding-box,border-box]"
          type="string"
          id="post-image-alt"
          name="image-alt"
        />
      </div>
      <div id="message-box" class="text-center pb-4"></div>
      <div id="errors text-red"></div>
      <div class="flex gap-8 p-12 justify-center">
        <button
          id="edit-post-submit-button"
          type="submit"
          class="bg-gradient-to-tr from-[var(--color-gradient-from)] to-[var(--color-gradient-to)] text-white p-4 w-[10rem] border-0 rounded-md text-lg font-bold cursor-pointer transition-[background] duration-300 ease-in-out hover:bg-gradient-to-tr hover:from-[var(--color-gradient-hover-from)] hover:to-[var(--color-gradient-hover-to)]"
        >
          Update
        </button>
        <button
          id="cancel-post-submit-button"
          type="button"
          class="bg-gradient-to-tr from-[var(--color-gradient-from)] to-[var(--color-gradient-to)] text-white p-4 w-[10rem] border-0 rounded-md text-lg font-bold cursor-pointer transition-[background] duration-300 ease-in-out hover:bg-gradient-to-tr hover:from-[var(--color-gradient-hover-from)] hover:to-[var(--color-gradient-hover-to)]"
        >
          Cancel
        </button>
      </div>
    </form>
    <footer
      class="mt-12 w-full text-center py-5 text-white bg-gradient-to-tr from-[var(--color-gradient-from)] to-[var(--color-gradient-to)]"
    >
      <p class="flex justify-center items-center text-base">
        &copy; 2024 Snappo. All rights reserved.
      </p>
    </footer>
  </body>
</html>

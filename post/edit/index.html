<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
    <link rel="stylesheet" href="/src/css/edit.css" />
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </head>
  <body>
   <header
          class="flex flex-wrap justify-between items-center bg-white p-2.5 px-5"
        >
          <div class="header-left">
            <a href="/">
              <img
                class="cursor-pointer"
                src="/asset/snappo.png"
                alt="Snappo logo"
              />
            </a>
          </div>

          <div class="flex flex-grow justify-start items-center mt-2 sm:mt-0 pl-7 md:pl-4">
            <input
              type="text"
              placeholder="Search...."
              class="w-3/4 sm:w-1/2 p-2 text-lg border border-gray-300 rounded-full outline-none "
            />
            <button class="cursor-pointer border-0 ml-[-40px] bg-white">
              <ion-icon
                class="text-lg text-[#a9a8a8]"
                name="search-outline"
              ></ion-icon>
            </button>
          </div>

          <div class="flex gap-4 mt-3 sm:mt-0 justify-start sm:justify-end">
            <div class="flex items-center gap-2">
              <button
                id="list"
                class="w-10 h-10 bg-gradient-to-r from-[#a060f0] to-[#5cc9f5] p-1 rounded transition-transform duration-300 border-none"
              >
                <ion-icon
                  class="text-white cursor-pointer"
                  size="large"
                  name="newspaper-outline"
                ></ion-icon>
              </button>
              <button
                id="profile"
                class="w-10 h-10 bg-gradient-to-r from-[#a060f0] to-[#5cc9f5] p-1 rounded transition-transform duration-300 border-none"
              >
                <ion-icon
                  class="text-white cursor-pointer"
                  size="large"
                  name="person-circle-outline"
                ></ion-icon>
              </button>
              <button
                id="logout-button"
                class="w-10 h-10 bg-gradient-to-r from-[#a060f0] to-[#5cc9f5] p-1 rounded transition-transform duration-300 border-none"
              >
                <ion-icon
                  class="text-white cursor-pointer"
                  size="large"
                  name="log-out-outline"
                ></ion-icon>
              </button>
            </div>
          </div>
        </header>

    <div class="container-text-center text-[#817575] text-2xl">
      <h1 class="text-center text-[#817575] pt-4 text-3xl">Edit Post</h1>
    </div>

    <form
      class="flex flex-col text-lg mx-auto max-w-[40rem] py-4 px-8 sm:px-0"
      name="updatePost"
    >
      <div class="flex flex-col gap-4">
        <label class="text-purple-600" for="post-title">Title:</label>
        <input
          class="mb-4 p-2 text-base border-2 border-transparent rounded-md"
          style="
            background-image: linear-gradient(white, white),
              linear-gradient(135deg, #e0b230, #07d8ba);
            background-origin: border-box;
            background-clip: padding-box, border-box;
          "
          type="text"
          id="post-title"
          name="title"
          required
        />

        <label class="text-purple-600" for="post-content">Content:</label>
        <textarea
          class="mb-4 p-2 text-base border-2 border-transparent rounded-md"
          style="
            background-image: linear-gradient(white, white),
              linear-gradient(135deg, #e0b230, #07d8ba);
            background-origin: border-box;
            background-clip: padding-box, border-box;
          "
          aria-label="message"
          rows="10"
          cols="45"
          name="body"
          id="message"
        ></textarea>

        <label class="text-purple-600" for="key-words">Tags:</label>
        <input
          class="mb-4 p-2 text-base border-2 border-transparent rounded-md"
          style="
            background-image: linear-gradient(white, white),
              linear-gradient(135deg, #e0b230, #07d8ba);
            background-origin: border-box;
            background-clip: padding-box, border-box;
          "
          type="strings"
          id="keywords"
          name="tags"
        />

        <label class="text-purple-600" for="post-image">Image URL:</label>
        <input
          class="mb-4 p-2 text-base border-2 border-transparent rounded-md"
          style="
            background-image: linear-gradient(white, white),
              linear-gradient(135deg, #e0b230, #07d8ba);
            background-origin: border-box;
            background-clip: padding-box, border-box;
          "
          type="url"
          id="post-image"
          name="image-url"
        />

        <label class="text-purple-600" for="image-alt">Image Alt:</label>
        <input
          class="mb-4 p-2 text-base border-2 border-transparent rounded-md"
          style="
            background-image: linear-gradient(white, white),
              linear-gradient(135deg, #e0b230, #07d8ba);
            background-origin: border-box;
            background-clip: padding-box, border-box;
          "
          type="string"
          id="post-image-alt"
          name="image-alt"
        />
      </div>
      <div id="message-box" class="text-center pb-4"></div>
      <div id="errors" style="color: red"></div>
      <div class="flex gap-8 p-12 justify-center">
        <button
          id="edit-post-submit-button"
          type="submit"
          class="bg-gradient-to-r from-[#07c0d8] to-[#9747ff] text-white py-4 px-8 w-40 rounded-lg font-bold cursor-pointer transition-colors duration-300 ease-in-out"
        >
          Update
        </button>
        <button
          id="cancel-post-submit-button"
          type="button"
          class="bg-gradient-to-r from-[#07c0d8] to-[#9747ff] text-white py-4 px-8 w-40 rounded-lg font-bold cursor-pointer transition-colors duration-300 ease-in-out"
        >
          Cancel
        </button>
      </div>
    </form>
  </body>
</html>
